seed_format: v1
task_type: code

goal: >-
  원본·기존 산출물·vendor를 보존하면서 translation-forensics의 프롬프트,
  파이프라인, 스키마, 회귀 테스트, 평가 패킷을 통합 개선하고,
  GPT-5.6 Terra 번역 결정 → GPT-5.6 Sol 독립 비평·수리 → 의미 재검사
  순서를 적용한 SSIS-908 전체 298블록 개선 후보를 동결 기준본과 두 명의
  독립 일본어 인간 검수자가 블라인드 비교하여 균형 계약의 충족 여부를
  pilot-evaluated로 판정한다.

background: |-
  이 저장소는 일본어 성인영상 SRT를 근거 중심으로 복원·번역하고 구조,
  의미, 맥락, 한국어 표현, 가독성 및 주장 경계를 검증하는 brownfield
  프로젝트다. 현재 SSIS-908에는 298블록의 완전한 기존 초안이 여러 개 있고,
  품질 향상은 독립 골드나 완료된 블라인드 인간 평가로 아직 증명되지 않았다.

  이 Seed는 GPT-5.6 직접 번역 viewer-natural 파일 하나를 기준본으로 동결하고,
  의미·화행 정확성을 하드 게이트로 둔 뒤 맥락·일관성과 자연스러움을 순차
  평가한다. 결과는 SSIS-908 파일럿에만 한정하며 final 승격 또는 다른 작품의
  품질 향상 주장으로 확장하지 않는다.

constraints:
  - 'Python 3.10 이상과 저장소의 기존 명명, 구조, UTF-8 무 BOM 및 LF 관례를 따른다.'
  - '원본 SRT, 음성, 기존 산출물과 vendor/를 수정하거나 덮어쓰지 않고 새 버전 디렉터리에만 산출한다.'
  - '변경 범위는 프롬프트, src/translation_forensics 파이프라인, schemas, 회귀 테스트, 로컬 평가 패킷 및 문서로 제한한다.'
  - '번역 결정은 gpt-5.6-terra, 독립 위험 비평·수리는 gpt-5.6-sol, 최종 의미 재검사는 파이프라인 하드 게이트가 담당하며 Sol 비평 없이 자동 합격시키지 않는다.'
  - '저장소의 직접 유료 API 호출은 필수가 아니며, 필요할 경우 실행 전 비용 산정과 사용자 별도 승인을 받아야 한다.'
  - '품질 판정 순서는 의미·화행 → 맥락·일관성 → 자연스러움 → 의미 재검사이고, 뒤 단계의 점수로 앞 단계 실패를 상쇄하지 않는다.'
  - '파일럿 평가는 SSIS-908의 298개 블록 전부를 대상으로 한다.'
  - '기준본은 workspaces/SSIS-908/intermediate/SSIS-908.gpt56-direct-v1.viewer-natural.srt이고 SHA-256은 8653a42dc952152994c75e9d43265c49eddc1b7d581cf05d8012fd87e3c3e25b다.'
  - '평가 기준, MQM 심각도 정의, 무작위화 seed, 기준본 해시와 블라인드 내부 키를 개선 후보 생성 전에 동결한다.'
  - '사람 확인 앵커와 오프셋 맵으로 시간축을 해결하고 clip_preparation_allowed=true가 되기 전에는 번역 평가 또는 298블록 청취 패킷 생성을 시작하지 않는다.'
  - '일본어 청취가 가능한 두 검수자는 서로 독립적으로 작업하고 기준본·개선본 제작에 참여하지 않으며 후보 출처를 보지 않는다.'
  - '검수 불일치는 두 검수자의 기록된 합의로 조정하고, 합의되지 않은 항목은 unresolved로 남겨 합격을 차단한다.'
  - '검수 패킷은 로컬에서만 생성하며 외부 전달과 회수는 사용자가 담당한다. 시스템은 명시적 승인 없이 외부 전송하지 않는다.'
  - '오류 감소율은 critical 또는 major 의미·맥락 오류가 하나 이상 있는 고유 블록 수로 계산하고 한 블록의 복수 오류는 한 번만 센다.'
  - 'unresolved는 실패로 계산하며, 비언어 블록은 두 검수자가 합의한 경우에만 자연스러움 동률로 처리한다.'
  - '자연스러움 승률과 패배율은 동률을 포함한 298개 최종 조정 블록 전체를 분모로 계산한다.'
  - '기준본의 critical/major 오류 블록 수가 0이면 50% 감소를 주장하지 않고 pilot 결과를 inconclusive로 기록한다.'
  - '모든 합격 기준이 충족되어도 상태는 pilot-evaluated이며 final 또는 human-reviewed-candidate로 승격하지 않는다.'
  - 'SSIS-908 결과를 다른 작품, 13개 전체 또는 시스템 전반의 품질 향상 증거로 일반화하지 않는다.'

acceptance_criteria:
  - description: >-
      통합 개선 시스템이 SSIS-908의 잠긴 298블록 구조를 보존하면서
      Terra 번역 결정, Sol 독립 비평·수리, 의미 재검사의 계보가 기록된
      새 source-faithful 및 viewer-natural 후보를 기존 파일을 덮어쓰지 않고 생성한다.
    verify_command: 'python -m pytest -q'
    expected_artifacts:
      - 'workspaces/SSIS-908/pilot-evaluation-v1/candidate/source-faithful.srt'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/candidate/viewer-natural.srt'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/candidate/provenance.json'
    output_assertion: null

  - description: >-
      사람 확인 앵커와 오프셋 맵이 원음과 298개 자막 블록의 시간축을
      resolved 상태로 만들고, 각 블록의 원음·일본어·장면 문맥을 포함한
      전수 청취 패킷을 재현 가능하게 생성하며 정렬 실패 시 평가를 중단한다.
    verify_command: 'python -m pytest -q'
    expected_artifacts:
      - 'workspaces/SSIS-908/pilot-evaluation-v1/timeline/alignment.json'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/audio-review/manifest.json'
    output_assertion: null

  - description: >-
      동결 기준본과 개선본을 동일 형식과 무작위 A/B 배치로 가린 298블록
      평가 패킷 두 벌을 만들고, 두 독립 검수자의 전수 직접 청취 판정과
      불일치 합의 기록을 누락 없이 수집하며 내부 키는 조정 전까지 봉인한다.
    verify_command: 'python -m pytest -q'
    expected_artifacts:
      - 'workspaces/SSIS-908/pilot-evaluation-v1/blind-review/reviewer-1.pack.zip'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/blind-review/reviewer-2.pack.zip'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/blind-review/internal-key.json'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/adjudication/final-decisions.jsonl'
    output_assertion: null

  - description: >-
      최종 조정 결과에서 개선본의 새 critical 의미·화행 오류가 0건이고,
      기준본 대비 critical/major 의미·맥락 오류 블록 수가 50% 이상 감소하며,
      298블록 전체 기준 자연스러움 승률이 65% 이상이고 패배율이 15% 이하일
      때만 파일럿을 pass로 판정한다.
    verify_command: 'python -m pytest -q'
    expected_artifacts:
      - 'workspaces/SSIS-908/pilot-evaluation-v1/results/metrics.json'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/results/error-ledger.jsonl'
    output_assertion: null

  - description: >-
      잠긴 SRT 구조, 문자 안전성, 2줄·길이·CPS 가독성, provenance, 증거 참조,
      프롬프트 계약과 합성 품질 회귀를 포함한 전체 자동 검증이 통과하고,
      파일럿에서 발견한 재현 가능한 오류 유형이 회귀 테스트로 고정된다.
    verify_command: 'python -m pytest -q'
    expected_artifacts:
      - 'tests/fixtures/translation-quality-regressions.json'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/results/automated-validation.json'
    output_assertion: null

  - description: >-
      기준본·후보·평가 패킷·검수 입력·조정 결과의 해시와 pass/fail/inconclusive
      근거를 담은 pilot-evaluated 보고서와 매니페스트를 생성하고, final 승격 금지,
      SSIS-908 한정 주장, 미수행 검증 및 남은 위험을 명시한다.
    verify_command: 'python -m pytest -q'
    expected_artifacts:
      - 'workspaces/SSIS-908/pilot-evaluation-v1/manifest.json'
      - 'workspaces/SSIS-908/pilot-evaluation-v1/PILOT_EVALUATION_REPORT.md'
    output_assertion: null

ontology_schema:
  name: TranslationQualityPilot
  description: >-
    SSIS-908 품질 개선 후보의 생성 계보, 원음 정렬, 블라인드 인간 평가,
    오류 감소 산식, 상태 경계와 주장 범위를 추적하는 도메인 모델이다.
  fields:
    - name: frozen_baseline
      type: object
      description: '경로, 298블록 구조와 SHA-256이 동결된 GPT-5.6 직접 번역 기준본'
      required: true
    - name: candidate_release
      type: object
      description: 'Terra 결정, Sol 비평·수리, 의미 재검사 계보를 가진 새 이중 SRT 후보'
      required: true
    - name: timeline_alignment
      type: object
      description: '사람 확인 앵커, 오프셋 맵, resolved 상태와 클립 준비 허용 여부'
      required: true
    - name: review_packet
      type: object
      description: '298블록의 원음·문맥·익명 A/B 후보와 봉인된 무작위화 키'
      required: true
    - name: reviewer_submissions
      type: array
      description: '두 독립 일본어 검수자의 블록별 직접 청취 판정과 MQM 오류'
      required: true
    - name: adjudication_record
      type: object
      description: '검수자 불일치의 합의 결과와 unresolved 차단 기록'
      required: true
    - name: pilot_metrics
      type: object
      description: '오류 블록 감소율, 신규 critical 수, 자연스러움 승·패·동률 집계'
      required: true
    - name: pilot_report
      type: object
      description: 'pass/fail/inconclusive 판정, 해시, 증거, 한계와 주장 경계'
      required: true

evaluation_principles:
  - name: semantic_fidelity
    description: '의미·화행·극성·주체·대상·강도 보존은 다른 품질 축으로 상쇄할 수 없는 하드 게이트다.'
    weight: 1.0
  - name: contextual_consistency
    description: '화자, 호칭, 존대, 용어와 장면 흐름은 원음 및 장면 문맥에 근거해 작품 전체에서 일관돼야 한다.'
    weight: 0.95
  - name: natural_korean
    description: '의미와 맥락 게이트를 통과한 범위 안에서 번역투와 가독성 문제를 줄이고 실제 한국어 발화처럼 다듬는다.'
    weight: 0.9
  - name: evaluation_integrity
    description: '동결·블라인드·독립 검수·합의 조정·재현 가능한 분모가 품질 주장보다 우선한다.'
    weight: 1.0
  - name: evidence_and_claim_boundary
    description: '미해결·미수행 검증을 숨기지 않고 pilot 한정 상태와 비최종 경계를 보존한다.'
    weight: 1.0

exit_conditions:
  - name: pilot_pass
    description: '6개 합격 기준이 모두 충족되고 균형 계약의 세 수치 조건을 만족한다.'
    criteria: 'pilot-evaluated 결과가 pass이고 새 critical=0, 오류 블록 감소율>=50%, 자연스러움 승률>=65%, 패배율<=15%다.'
  - name: pilot_fail
    description: '새 critical 오류, 자동 검증 실패 또는 수치 계약 미달이 확인되면 실패로 종료한다.'
    criteria: '결과를 pilot-evaluated/fail로 기록하고 final 승격이나 개선 주장을 하지 않는다.'
  - name: pilot_inconclusive
    description: '기준 분모 0, 검수 합의 실패, 평가 입력 불완전 또는 증거 부족으로 개선 여부를 판정할 수 없다.'
    criteria: '결과를 pilot-evaluated/inconclusive로 기록하고 누락된 증거와 재개 조건을 명시한다.'
  - name: wait_for_human_review
    description: '두 검수자의 독립 판정이 반환되지 않은 동안 실행을 안전하게 대기시킨다.'
    criteria: '상태를 awaiting-human-review로 유지하며 평가 완료나 품질 개선을 주장하지 않는다.'
  - name: stop_scope_expansion
    description: 'SSIS-908 파일럿 판정 후 다른 작품 배치 적용이나 final 승격으로 자동 진행하지 않는다.'
    criteria: '후속 확대는 별도 Seed와 사용자 승인이 있어야 한다.'

brownfield_context:
  project_type: brownfield
  context_references:
    - path: 'C:/Users/ehddk/OneDrive/문서/번역 프로젝트/translation-forensics'
      role: primary
      summary: 'evidence-first 일본어 SRT 복원·번역·검증 파이프라인과 SSIS-908 작업공간'
    - path: 'C:/Users/ehddk/OneDrive/문서/번역 프로젝트/translation-forensics/references/translation-prompt-v6.txt'
      role: reference
      summary: '의미 복원과 자연스러운 한국어 작성의 최상위 번역 원칙'
    - path: 'C:/Users/ehddk/OneDrive/문서/번역 프로젝트/translation-forensics/workspaces/SSIS-908'
