    - '미확정 의미는 null, unknown, abstained 또는 unresolved로 보존하고 자연스러움을 위해 창작하지 않는다.'
    - '자동 산출물은 사람 final과 분리하며 미수행 검증을 통과로 기록하지 않는다.'
  existing_dependencies:
    - 'Python >=3.10'
    - 'jsonschema>=4.21'
    - 'pytest (dev)'
    - 'openai (optional cloud integration)'
    - 'faster-whisper (optional ASR)'

out_of_scope:
  - '원본 SRT, 음성, 기존 산출물 또는 vendor 구현 수정'
  - 'SSIS-908 이외 12개 작품의 재번역 또는 배치 롤아웃'
  - 'pilot 결과를 전체 시스템, 다른 작품 또는 100% 정확성으로 일반화하는 주장'
  - 'human-reviewed-candidate 또는 final 승격'
  - '사용자 승인 없는 외부 전송, 유료 API 호출, 게시 또는 배포'

lifecycle:
  - 'draft'
  - 'timeline-ready'
  - 'candidate-frozen'
  - 'review-pack-ready'
  - 'awaiting-human-review'
  - 'adjudicating'
  - 'pilot-evaluated/pass|fail|inconclusive'

