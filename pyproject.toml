[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-forensics"
version = "0.1.0"
description = "Evidence-first Japanese subtitle restoration and validation workflow"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
forensics = ["joblib", "numpy", "pandas", "scipy", "scikit-learn"]
asr = ["faster-whisper"]
quality-asr = [
  "faster-whisper",
  "sherpa-onnx>=1.13.4",
  "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech.git#subdirectory=pkg/k2-asr",
]
machine-draft = ["deep-translator", "requests"]
cloud = ["openai"]
dev = ["pytest"]

[project.scripts]
translation-forensics = "translation_forensics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
